<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiteMATE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#A80000" media="(prefers-color-scheme: dark)">

<title>BiteMATE</title>
<style>
/* Layout: one narrow column, sticky header, four tabs in a bottom bar. Alerts sit above every tab. */
:root{
  --bg:#FBF6F1; --surface:#FFFFFF; --ink:#2A1515; --muted:#7A5F5C; --line:#EBDCD6;
  --accent:#D10000; --accent-ink:#FFFFFF; --accent-soft:#FDE8E4;
  --hdr:#D10000; --hdr-ink:#FFFFFF;
  --good:#1E7B4F; --good-soft:#DDF1E6;
  --warn:#8A5A0B; --warn-soft:#FBF0D9; --bad:#A4161A; --bad-soft:#F9DDDA;
  --font-head:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --font-body:-apple-system,system-ui,"Helvetica Neue",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1110; --surface:#271917; --ink:#F6E9E6; --muted:#B79C97; --line:#3A2724;
  --accent:#FF5448; --accent-ink:#2A0504; --accent-soft:#3D1E1B;
  --hdr:#A80000; --hdr-ink:#FFFFFF;
  --good:#6FC49A; --good-soft:#1E3027;
  --warn:#E0B055; --warn-soft:#352B14; --bad:#FF8A80; --bad-soft:#40201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1110; --surface:#271917; --ink:#F6E9E6; --muted:#B79C97; --line:#3A2724;
  --accent:#FF5448; --accent-ink:#2A0504; --accent-soft:#3D1E1B;
  --hdr:#A80000; --hdr-ink:#FFFFFF;
  --good:#6FC49A; --good-soft:#1E3027;
  --warn:#E0B055; --warn-soft:#352B14; --bad:#FF8A80; --bad-soft:#40201D; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light}
[hidden]{display:none!important}
body{margin:0}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdr-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 -16px 14px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;border-radius:0 0 22px 22px;box-shadow:0 2px 10px rgba(80,0,0,.25)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover;flex:none;background:#fff}
header.top h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
header.top .sub{color:rgba(255,255,255,.88)}
header.top .icon-btn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.sub{color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;margin:6px 0 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert b{font-weight:600}
.alert .msg{min-width:0;flex:1 1 220px}
.alert .btn{background:transparent;border-color:currentColor;color:inherit}
.note{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:13px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 12px;flex-wrap:wrap}
.bar h2{font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.click{cursor:pointer;width:100%;text-align:left}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.row>*{min-width:0}
.card h3{font-size:17px}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meter{height:6px;border-radius:9px;background:var(--line);margin:10px 0 4px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:9px}
.meter.low i{background:var(--warn)} .meter.out i{background:var(--bad)}
.qty{font-family:var(--font-head);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-head);font-size:17px;margin-bottom:4px}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin:0 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:12px;display:block;margin-top:3px}
.field{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;font-weight:600;position:relative}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.big3 .card{padding:12px}
.big3 .lbl{font-size:12px;color:var(--muted);font-weight:600}
.big3 .num{font-family:var(--font-head);font-size:clamp(17px,5vw,26px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
.num.good{color:var(--good)} .num.bad{color:var(--bad)}
.split{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line);margin:12px 0 8px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.entry{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.entry:last-child{border-bottom:0}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)}
.overlay{position:fixed;inset:0;background:rgba(10,15,13,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;gap:10px}
.sheet-head h2{font-size:20px}
.sheet-body{padding:8px 18px 18px;overflow:auto}
.sheet-actions{position:sticky;bottom:0;padding-top:8px;background:var(--bg);display:flex;gap:8px}
.sheet-actions .btn{flex:1}
.ing{display:grid;grid-template-columns:1fr 70px 70px 38px;gap:6px;margin-bottom:6px}
.ing button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px}
.steps{white-space:pre-wrap;margin:6px 0 0}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 14px/30px var(--font-head);text-align:center}
.rank.top{background:var(--accent);color:var(--accent-ink)}
.chips.sub{margin:-4px 0 10px}
.chip.small{padding:4px 12px;font-size:12px}
.grp{font:700 12px/1 var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px}
.costbox{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin:14px 0 0}
.costbox p{margin:0 0 6px}.costbox p:last-child{margin:0}
.line{display:grid;grid-template-columns:1fr 90px 38px;gap:6px;margin-bottom:6px}
.line button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px}
ul.plain{list-style:none;margin:6px 0;padding:0}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:420px){.big3 .card{padding:10px}.ing{grid-template-columns:1fr 60px 60px 32px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>

<script>
const COLS=['recipes','orders','stock','money'];
const S={recipes:[],orders:[],stock:[],money:[],settings:{currency:'₵'}};
const U={tab:'recipes',q:'',stockF:'all',orderF:'open',month:null,custSort:'recent',custPeriod:'all'};
const LOADED={};let READY=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
U.month=todayISO().slice(0,7);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=n=>(S.settings.currency||'')+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtN=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtDate=iso=>iso?new Date(iso+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'';
const monthName=ym=>new Date(ym+'-01T00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

/* ---------- Storage: shared database when available, this device otherwise ---------- */
const store={mode:'local',
  init(){
    try{const raw=localStorage.getItem('kitchenbook');if(raw){const d=JSON.parse(raw);COLS.forEach(c=>{if(Array.isArray(d[c]))S[c]=d[c]});S.settings={...S.settings,...(d.settings||{})}}}catch(e){}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    READY=true;render();checkAlerts(true);
  },
  saveLocal(){try{localStorage.setItem('kitchenbook',JSON.stringify(S))}catch(e){toast('Could not save. Phone storage may be full.')}},
  put(col,obj){
    const id=obj.id||uid();const {id:_,...data}=obj;
    const i=S[col].findIndex(x=>x.id===id);const rec={...data,id};if(i<0)S[col].push(rec);else S[col][i]=rec;
    this.saveLocal();if(col==='stock')checkAlerts();render();return id;
  },
  del(col,id){S[col]=S[col].filter(x=>x.id!==id);this.saveLocal();if(col==='stock')checkAlerts();render()},
  putSettings(){this.saveLocal();render()}
};

/* ---------- Low-stock alerts (on this phone, no internet needed) ---------- */
async function notify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return false;
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)await reg.showNotification(title,{body,icon:'icon-192.png',tag:'low-stock-'+Date.now()});else new Notification(title,{body});
    return true;
  }catch(e){return false}
}
function setBadge(n){try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
function checkAlerts(quiet){
  const L=lows(),ids=L.map(s=>s.id).sort(),prev=(S.settings.notified||[]);
  const fresh=L.filter(s=>!prev.includes(s.id));
  if(JSON.stringify(ids)!==JSON.stringify(prev.slice().sort())){S.settings.notified=ids;store.saveLocal()}
  setBadge(L.length);
  if(fresh.length&&!quiet){
    const one=s=>s.qty<=0?`${s.name} is finished`:`${s.name}: ${fmtN(s.qty)} ${s.unit} left`;
    notify(fresh.length===1?'Running low: '+fresh[0].name:fresh.length+' items running low',fresh.map(one).join('. '));
  }
}
function setupNote(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(ios&&!standalone)return '<div class="note"><span><b>Add this app to your home screen first.</b> Tap the Share button in Safari, choose Add to Home Screen, then open BiteMATE from your home screen. Alerts only work from there.</span></div>';
  if(!('Notification' in window))return '';
  if(Notification.permission==='default')return '<div class="note"><span>Turn on alerts so your phone warns you when stock runs low.</span><button class="btn small primary" data-act="enable-alerts">Turn on alerts</button></div>';
  if(Notification.permission==='denied')return '<div class="note"><span>Alerts are blocked. Open iPhone Settings, then Notifications, then BiteMATE, and allow them.</span></div>';
  return '';
}

/* ---------- Stock helpers ---------- */
const stockState=s=>s.qty<=0?'out':(s.qty<=s.low?'low':'ok');
const lows=()=>S.stock.filter(s=>stockState(s)!=='ok').sort((a,b)=>a.qty-b.qty);
const findStock=name=>S.stock.find(s=>s.name.trim().toLowerCase()===String(name).trim().toLowerCase());

/* ---------- Money helpers ---------- */
const CATS_IN=[['sales','Customer orders'],['other_in','Other money in (classes, tips, catering fees)']];
const CATS_OUT=[['food','Ingredients & food','cost'],['pack','Packaging','cost'],['delivery','Delivery & transport','cost'],
  ['fuel','Gas, power & water','overhead'],['rent','Rent','overhead'],
  ['equip','Equipment & repairs','overhead'],['other_out','Anything else','overhead']];
const catLabel=(type,cat)=>((type==='in'?CATS_IN:CATS_OUT).find(c=>c[0]===cat)||[0,'Other'])[1];
const catGroup=cat=>(CATS_OUT.find(c=>c[0]===cat)||[0,0,'overhead'])[2];
function totals(ym){
  const rows=S.money.filter(m=>!ym||m.date.startsWith(ym));
  let inn=0,cost=0,over=0;
  rows.forEach(m=>{if(m.type==='in')inn+=m.amount;else if(catGroup(m.cat)==='cost')cost+=m.amount;else over+=m.amount});
  return {rows,inn,cost,over,out:cost+over,left:inn-cost-over};
}
const paidOf=o=>o.paidAmount!==undefined?num(o.paidAmount):(o.paid?num(o.total):0);
const owedOf=o=>Math.max(0,num(o.total)-paidOf(o));
function syncOrderMoney(o){
  const mid='order-'+o.id,p=paidOf(o);
  if(p>0)store.put('money',{id:mid,type:'in',cat:'sales',amount:p,date:o.paidDate||todayISO(),note:'Order: '+o.customer+(p<num(o.total)?' (part payment)':''),orderId:o.id});
  else if(S.money.some(m=>m.id===mid))store.del('money',mid);
}
const ckey=n=>String(n||'').trim().toLowerCase();
function customers(){
  const m={};
  S.orders.forEach(o=>{const k=ckey(o.customer);if(!k)return;const c=m[k]||(m[k]={key:k,name:o.customer.trim(),orders:[],spent:0,owed:0,handle:'',source:''});c.orders.push(o);c.spent+=paidOf(o);c.owed+=owedOf(o)});
  return Object.values(m).map(c=>{c.orders.sort((a,b)=>(b.created||b.due||'').localeCompare(a.created||a.due||''));
    c.orders.forEach(o=>{if(!c.handle&&o.handle)c.handle=o.handle;if(!c.source&&o.source)c.source=o.source});c.last=c.orders[0].created||c.orders[0].due||'';return c})
    .sort((a,b)=>b.last.localeCompare(a.last));
}
function recipeCost(r){
  let cost=0;const missing=[];
  (r.ingredients||[]).forEach(i=>{const s=findStock(i.name);if(s&&num(s.unitCost)>0)cost+=num(i.qty)*num(s.unitCost);else missing.push(i.name)});
  const sv=num(r.servings)||1;return {cost,perPortion:cost/sv,missing,servings:sv};
}
const keepPct=()=>Math.min(90,Math.max(1,num(S.settings.keep)||50));
const suggestPrice=pp=>Math.ceil(pp/(1-keepPct()/100));
const bucketOf=o=>{if(!o.due)return 'No date';const t=todayISO();if(o.due<t)return 'Overdue';if(o.due===t)return 'Today';const d=new Date();d.setDate(d.getDate()+1);return o.due===d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())?'Tomorrow':'Later'};
function orderMessage(o){
  const first=String(o.customer||'').trim().split(/\s+/)[0],paid=paidOf(o),owe=owedOf(o);
  return `Hi ${first}, your order is confirmed:\n${o.items}\nTotal: ${fmt(o.total)}${paid>0?`\nPaid: ${fmt(paid)}`:''}${owe>0&&paid>0?`\nBalance: ${fmt(owe)}`:''}${o.due?`\nReady by: ${new Date(o.due+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}`:''}\nThank you!`;
}

/* ---------- Sheet (pop-up form) ---------- */
function sheet(title,html,onSubmit,label='Save'){
  closeSheet();
  const el=document.createElement('div');el.className='overlay';el.id='sheet';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">&times;</button></div><form class="sheet-body" id="sheetForm">${html}${onSubmit?`<div class="sheet-actions"><button class="btn primary" type="submit">${esc(label)}</button></div>`:''}</form></div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  const f=el.querySelector('form');
  f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit&&onSubmit(new FormData(f),f)!==false)closeSheet()});
  el.addEventListener('mousedown',e=>{if(e.target===el)closeSheet()});
  const first=f.querySelector('input:not([type=hidden]),select,textarea');if(first&&!/Mobi|Android/i.test(navigator.userAgent))first.focus();
}
function closeSheet(){const s=$('#sheet');if(s)s.remove();document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- Render ---------- */
function render(){
  const d=new Date();$('#today').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.tab===U.tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!READY)return;
  const L=lows(),b=$('#stockBadge');b.hidden=!L.length;b.textContent=L.length;$('#setup').innerHTML=setupNote();setBadge(L.length);
  $('#alert').innerHTML=L.length?`<div class="alert" role="alert"><div class="msg"><b>${L.length} ${L.length===1?'item is':'items are'} running low:</b> ${esc(L.slice(0,3).map(s=>s.name).join(', '))}${L.length>3?' and '+(L.length-3)+' more':''}</div><button class="btn small" data-act="shopping">Shopping list</button></div>`:'';
  const ex=[...COLS.flatMap(c=>S[c])].some(x=>x.example);
  $('#examples').innerHTML=ex?`<div class="note"><span>Sample entries are showing so you can see how things work.</span><button class="btn small" data-act="clear-examples">Remove samples</button></div>`:'';
  $('#view').innerHTML=({recipes:vRecipes,orders:vOrders,stock:vStock,money:vMoney})[U.tab]();
}
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;

function vRecipes(){
  const q=U.q.toLowerCase();
  const list=S.recipes.filter(r=>!q||(r.name+' '+r.category).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="bar"><h2>Recipe book</h2><button class="btn primary" data-act="add-recipe">Add recipe</button></div>
  ${S.recipes.length?`<div class="field"><input type="search" id="q" placeholder="Search recipes" value="${esc(U.q)}" aria-label="Search recipes"></div>`:''}
  <div class="list">${list.map(r=>{
    const short=(r.ingredients||[]).filter(i=>{const s=findStock(i.name);return s&&s.qty<num(i.qty)});
    return `<button class="card click" data-act="open-recipe" data-id="${r.id}"><div class="row"><div><h3>${esc(r.name)}</h3><div class="meta">${esc(r.category||'')}${r.servings?' &middot; serves '+esc(r.servings):''} &middot; ${(r.ingredients||[]).length} ingredients${(()=>{const c=recipeCost(r);return c.cost>0?' &middot; costs '+fmt(c.perPortion)+' a portion':''})()}</div></div>${short.length?`<span class="pill warn">Short on ${esc(short[0].name)}${short.length>1?' +'+(short.length-1):''}</span>`:''}</div></button>`}).join('')
    ||(S.recipes.length?empty('No match','Try a different word.'):empty('Your recipe book is empty','Add your first recipe. List its ingredients so stock can update when you cook.'))}</div>`;
}
function orderCard(o){
  const open=o.status!=='Delivered',late=open&&o.due&&o.due<todayISO(),paid=paidOf(o),owe=owedOf(o);
  const next={New:'Preparing',Preparing:'Ready',Ready:'Delivered'};
  const payPill=num(o.total)>0&&owe===0?'<span class="pill">Paid</span>':paid>0?`<span class="pill warn">Owes ${fmt(owe)}</span>`:'<span class="pill warn">Not paid</span>';
  return `<div class="card"><div class="row"><div><h3>${esc(o.customer)}</h3><div class="meta">${esc(o.items)}</div>${o.notes?`<div class="meta">Note: ${esc(o.notes)}</div>`:''}</div><div class="amt">${fmt(o.total)}</div></div>
  <div class="actions" style="margin-top:10px;align-items:center"><span class="pill ${o.status==='Ready'?'':'plain'}">${esc(o.status)}</span>${o.source?`<span class="pill plain">${esc(o.source)}${o.handle?' '+esc(o.handle):''}</span>`:''}${o.delivery==='Delivery'?'<span class="pill plain">Delivery</span>':''}${payPill}${o.due?`<span class="pill ${late?'bad':'plain'}">${late?'Overdue, ':'Due '}${fmtDate(o.due)}</span>`:''}</div>
  <div class="actions">${next[o.status]?`<button class="btn small soft" data-act="next-status" data-id="${o.id}">Mark ${next[o.status]}</button>`:''}${owe>0&&num(o.total)>0?`<button class="btn small soft" data-act="mark-paid" data-id="${o.id}">Paid in full</button>`:''}<button class="btn small" data-act="copy" data-text="${esc(orderMessage(o))}">Copy message</button><button class="btn small" data-act="edit-order" data-id="${o.id}">Edit</button></div></div>`;
}
function vCustomers(){
  const all=customers(),top=U.custSort==='top',ym=todayISO().slice(0,7);
  const seg=`<div class="chips">${[['recent','Recent'],['top','Top spenders']].map(([k,l])=>`<button class="chip small" data-act="cust-sort" data-v="${k}" aria-pressed="${U.custSort===k}">${l}</button>`).join('')}</div>`;
  const regular=c=>c.orders.length>=3?'<span class="pill">Regular</span>':'';
  if(!top)return seg+`<div class="list">${all.map(c=>`<button class="card click" data-act="view-customer" data-key="${esc(c.key)}"><div class="row"><div><h3>${esc(c.name)}</h3><div class="meta">${c.orders.length} ${c.orders.length===1?'order':'orders'} &middot; paid ${fmt(c.spent)}${c.source?' &middot; '+esc(c.source):''}${c.handle?' '+esc(c.handle):''}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${c.owed>0?`<span class="pill warn">Owes ${fmt(c.owed)}</span>`:''}${regular(c)}</div></div></button>`).join('')||empty('No customers yet','Customers appear here automatically when you log orders.')}</div>`;
  const month=U.custPeriod==='month';
  const ranked=all.map(c=>{const os=month?c.orders.filter(o=>(o.created||o.due||'').startsWith(ym)):c.orders;return {c,os,paid:os.reduce((t,o)=>t+paidOf(o),0)}})
    .filter(x=>x.os.length&&x.paid>0).sort((a,b)=>b.paid-a.paid||b.os.length-a.os.length).slice(0,20);
  const per=`<div class="chips sub">${[['month','This month'],['all','All time']].map(([k,l])=>`<button class="chip small" data-act="cust-period" data-v="${k}" aria-pressed="${U.custPeriod===k}">${l}</button>`).join('')}</div>`;
  return seg+per+`<div class="list">${ranked.map((x,i)=>`<button class="card click" data-act="view-customer" data-key="${esc(x.c.key)}"><div class="row" style="align-items:center"><span class="rank ${i<3?'top':''}">${i+1}</span><div style="flex:1"><h3>${esc(x.c.name)} ${regular(x.c)}</h3><div class="meta">${x.os.length} ${x.os.length===1?'order':'orders'} &middot; last ordered ${fmtDate(x.c.last)}</div></div><div class="amt">${fmt(x.paid)}</div></div></button>`).join('')||empty('No ranking yet',month?'Nobody has paid for an order this month yet.':'Rankings appear once customers have paid for orders.')}</div>${ranked.length?'<p class="meta" style="margin-top:10px">Ranked by what each customer has actually paid.</p>':''}`;
}
function vOrders(){
  const open=o=>o.status!=='Delivered';
  const owed=S.orders.reduce((t,o)=>t+owedOf(o),0);
  const dueNow=S.orders.filter(o=>open(o)&&o.due&&o.due<=todayISO()).length;
  const head=`<div class="bar"><h2>Customer orders</h2><button class="btn primary" data-act="add-order">Log an order</button></div>
  ${dueNow>0?`<div class="note"><span><b>${dueNow}</b> ${dueNow===1?'order is':'orders are'} due today or overdue</span></div>`:''}
  ${owed>0?`<div class="note"><span>Customers still owe you <b>${fmt(owed)}</b></span></div>`:''}
  <div class="chips">${[['open','To do'],['done','Delivered'],['all','All'],['customers','Customers']].map(([k,l])=>`<button class="chip" data-act="order-filter" data-v="${k}" aria-pressed="${U.orderF===k}">${l}</button>`).join('')}</div>`;
  if(U.orderF==='customers')return head+vCustomers();
  const list=S.orders.filter(o=>U.orderF==='all'||(U.orderF==='open')===open(o));
  list.sort((a,b)=>U.orderF==='open'?(a.due||'9').localeCompare(b.due||'9'):(b.due||'').localeCompare(a.due||''));
  let body;
  if(!list.length)body=empty(U.orderF==='open'?'Nothing to cook right now':'No orders here','Log an order when a customer asks, so nothing gets forgotten.');
  else if(U.orderF==='open')body=['Overdue','Today','Tomorrow','Later','No date'].map(g=>{const l=list.filter(o=>bucketOf(o)===g);return l.length?`<div class="grp">${g}</div><div class="list">${l.map(orderCard).join('')}</div>`:''}).join('');
  else body=`<div class="list">${list.map(orderCard).join('')}</div>`;
  return head+body;
}
function vStock(){
  const f=U.stockF;
  const list=S.stock.filter(s=>f==='all'||(f==='low'?stockState(s)!=='ok':s.category===f)).sort((a,b)=>(stockState(a)==='ok')-(stockState(b)==='ok')||a.name.localeCompare(b.name));
  return `<div class="bar"><h2>What's in stock</h2><button class="btn primary" data-act="add-stock">Add item</button></div>
  <div class="chips">${[['all','All'],['low','Running low'],['Ingredient','Ingredients'],['Packaging','Packaging']].map(([k,l])=>`<button class="chip" data-act="stock-filter" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
  <div class="list">${list.map(s=>{
    const st=stockState(s),pct=Math.max(0,Math.min(100,s.qty/Math.max(s.low*3,s.qty,1)*100));
    return `<div class="card"><div class="row"><div><h3>${esc(s.name)}</h3><div class="meta">${esc(s.category)} &middot; warn me at ${fmtN(s.low)} ${esc(s.unit)}${num(s.unitCost)>0?' &middot; '+fmt(s.unitCost)+' per '+esc(s.unit):''}${s.lastBought?' &middot; restocked '+fmtDate(s.lastBought):''}</div></div><div style="text-align:right"><div class="qty">${fmtN(s.qty)} <span class="meta">${esc(s.unit)}</span></div>${st==='ok'?'':`<span class="pill ${st==='out'?'bad':'warn'}">${st==='out'?'Finished':'Running low'}</span>`}</div></div>
    <div class="meter ${st}"><i style="width:${pct}%"></i></div>
    <div class="actions" style="margin-top:8px"><button class="btn small soft" data-act="update-stock" data-id="${s.id}">Update amount</button><button class="btn small" data-act="edit-stock" data-id="${s.id}">Edit</button></div></div>`}).join('')
    ||empty(f==='low'?'Nothing is running low':'No stock items yet',f==='low'?'You will see items here when they drop to the level you set.':'Add what you keep in your kitchen, and set the level where you want a warning.')}</div>`;
}
function vMoney(){
  const t=totals(U.month),cur=U.month===todayISO().slice(0,7);
  const owed=S.orders.reduce((a,o)=>a+owedOf(o),0);
  const mx=Math.max(t.inn,t.out,1);
  const sentence=t.inn===0&&t.out===0?'Nothing recorded for this month yet.':
    t.left>=0?`After paying for everything, you kept <b>${fmt(t.left)}</b>.`:`You spent <b>${fmt(-t.left)}</b> more than you earned.`;
  const per=t.inn>0?`<div class="meta" style="margin-top:6px">Of every 100 you earned: ${Math.round(t.cost/t.inn*100)} went on making food, ${Math.round(t.over/t.inn*100)} on running costs, and ${Math.max(0,Math.round(t.left/t.inn*100))} was yours.</div>`:'';
  return `<div class="bar"><h2>Money</h2><div style="display:flex;gap:6px;align-items:center"><button class="icon-btn" data-act="month" data-v="-1" aria-label="Previous month">&lsaquo;</button><b style="min-width:110px;text-align:center">${monthName(U.month)}</b><button class="icon-btn" data-act="month" data-v="1" aria-label="Next month" ${cur?'disabled':''}>&rsaquo;</button></div></div>
  <div class="big3"><div class="card"><div class="lbl">Money in</div><div class="num good">${fmt(t.inn)}</div></div><div class="card"><div class="lbl">Money out</div><div class="num">${fmt(t.out)}</div></div><div class="card"><div class="lbl">What's left</div><div class="num ${t.left<0?'bad':'good'}">${fmt(t.left)}</div></div></div>
  <div class="card" style="margin-bottom:12px"><div>${sentence}</div>
    <div class="split" role="img" aria-label="Where the money went">${t.inn||t.out?`<i style="width:${t.cost/mx*100}%;background:var(--warn)"></i><i style="width:${t.over/mx*100}%;background:var(--muted)"></i>${t.left>0?`<i style="width:${t.left/mx*100}%;background:var(--good)"></i>`:''}`:''}</div>
    <div class="legend"><span style="--c:var(--warn)">Making food ${fmt(t.cost)}</span><span style="--c:var(--muted)">Running costs ${fmt(t.over)}</span><span style="--c:var(--good)">Kept ${fmt(Math.max(0,t.left))}</span></div>${per}
    <div class="meta" style="margin-top:8px"><b>Making food</b> is what you buy to cook: ingredients, packaging, delivery. <b>Running costs</b> (overhead) are bills you pay even in a quiet week: rent, gas, power, equipment.</div></div>
  ${owed>0?`<div class="note"><span>Not counted yet: customers owe you <b>${fmt(owed)}</b>. It moves into Money in when you mark an order paid.</span></div>`:''}
  <div class="actions" style="margin:0 0 8px"><button class="btn primary" data-act="add-money" data-type="in">Money in</button><button class="btn" data-act="add-money" data-type="out">Money out</button></div>
  <div class="card" style="padding:4px 14px">${t.rows.sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<button class="entry" data-act="edit-money" data-id="${m.id}"><div style="min-width:0"><div style="font-weight:600">${esc(catLabel(m.type,m.cat))}</div><div class="meta">${fmtDate(m.date)}${m.note?' &middot; '+esc(m.note):''}</div></div><div class="amt ${m.type}">${m.type==='in'?'+':'-'}${fmt(m.amount)}</div></button>`).join('')||'<div class="empty" style="border:0">No entries this month. Tap Money in when a customer pays, or Money out when you buy or pay for something.</div>'}</div>`;
}

/* ---------- Forms ---------- */
const sel=(name,opts,cur)=>`<select name="${name}" id="f_${name}">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const ingRow=(i={})=>`<div class="ing"><input type="text" name="in_name" list="stocknames" placeholder="Ingredient" value="${esc(i.name||'')}" aria-label="Ingredient"><input type="number" step="any" min="0" name="in_qty" placeholder="Qty" value="${esc(i.qty??'')}" aria-label="Quantity"><input type="text" name="in_unit" placeholder="Unit" value="${esc(i.unit||'')}" aria-label="Unit"><button type="button" data-act="rm-row" aria-label="Remove ingredient">&times;</button></div>`;

  const dl=`<datalist id="stocknames">${S.stock.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`;

  <div class="two field"><div><label for="f_category">Type</label>${sel('category',['Main','Starter','Side','Dessert','Bakery','Drink','Sauce','Other'],r.category||'Main')}</div><div><label for="f_servings">Portions it makes</label><input type="number" id="f_servings" name="servings" min="1" value="${esc(r.servings||'')}"></div></div>
  <div class="field"><label for="f_price">What you charge per portion (optional)<span class="hint">Used to show your profit, and to fill in the price when you log an order.</span></label><input type="number" id="f_price" name="price" step="any" min="0" value="${esc(r.price??'')}"></div>
  <div class="field"><label>Ingredients<span class="hint">Pick names from your stock list so the app can take them off stock when you cook.</span></label><div id="ings">${(r.ingredients&&r.ingredients.length?r.ingredients:[{},{},{}]).map(ingRow).join('')}</div><button type="button" class="btn small" data-act="add-ing">Add ingredient</button></div>

function recipeView(id){

    <p>To keep ${keepPct()}% of every sale, charge about <b>${fmt(suggestPrice(c.perPortion))}</b> a portion.</p>
    ${c.missing.length?`<p class="meta">No price yet for ${esc(c.missing.join(', '))}, so the real cost is higher. Gas, rent and other running costs are not included.</p>`:'<p class="meta">Gas, rent and other running costs are not included.</p>'}</div>`})()}
  <h3 style="margin-top:14px;font-size:16px">Ingredients</h3><ul class="plain">${(r.ingredients||[]).map(i=>{const s=findStock(i.name),short=s&&s.qty<i.qty;return `<li><span>${esc(i.name)}${short?` <span class="pill warn">only ${fmtN(s.qty)} ${esc(s.unit)} left</span>`:''}</span><span class="meta">${fmtN(i.qty)} ${esc(i.unit)}</span></li>`}).join('')||'<li class="meta">None listed</li>'}</ul>

function cookForm(id){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  const tracked=(r.ingredients||[]).filter(i=>findStock(i.name));
  sheet('Cook a batch: '+r.name,`<p class="meta" style="margin-top:0">This takes the ingredients off your stock list. Amounts use the same unit as your stock.</p>
  <div class="field"><label for="f_batches">How many batches?</label><input type="number" id="f_batches" name="batches" min="1" step="1" value="1"></div>
  <ul class="plain">${tracked.map(i=>`<li><span>${esc(i.name)}</span><span class="meta">${fmtN(i.qty)} ${esc(findStock(i.name).unit)} per batch</span></li>`).join('')||'<li class="meta">None of this recipe\'s ingredients are on your stock list yet.</li>'}</ul>`,
  fd=>{const b=Math.max(1,num(fd.get('batches')));tracked.forEach(i=>{const s=findStock(i.name);store.put('stock',{...s,qty:Math.max(0,+(s.qty-i.qty*b).toFixed(3))})});toast('Stock updated')},'Take off stock');

const lineRow=(l={})=>`<div class="line"><select name="ln_recipe" aria-label="Recipe"><option value="">Choose a recipe</option>${S.recipes.map(r=>`<option value="${r.id}" ${r.id===l.recipeId?'selected':''}>${esc(r.name)}</option>`).join('')}</select><input type="number" name="ln_portions" min="1" step="1" placeholder="Portions" value="${esc(l.portions??'')}" aria-label="Portions"><button type="button" data-act="rm-row" aria-label="Remove">&times;</button></div>`;
function takeStockForOrder(o){
  const need={};
  (o.lines||[]).forEach(l=>{const r=S.recipes.find(x=>x.id===l.recipeId);if(!r)return;const f=num(l.portions)/(num(r.servings)||1);
    (r.ingredients||[]).forEach(i=>{const s=findStock(i.name);if(s)need[s.id]=(need[s.id]||0)+num(i.qty)*f})});
  Object.keys(need).forEach(id=>{const s=byId('stock',id);store.put('stock',{...s,qty:Math.max(0,+(s.qty-need[id]).toFixed(3))})});
  return Object.keys(need).length;
}
function orderForm(o={}){
  const dl=`<datalist id="custnames">${customers().map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;
  sheet(o.id?'Edit order':'Log an order',`${dl}
  <div class="field"><label for="f_customer">Customer name</label><input type="text" id="f_customer" name="customer" list="custnames" autocomplete="off" required value="${esc(o.customer||'')}"></div>
  <div class="two field"><div><label for="f_source">Where from?</label>${sel('source',['Snapchat','WhatsApp','Instagram','TikTok','Phone call','Other'],o.source||'Snapchat')}</div><div><label for="f_handle">Their name or number there<span class="hint">Optional</span></label><input type="text" id="f_handle" name="handle" value="${esc(o.handle||'')}"></div></div>
  <div class="field"><label for="f_items">What did they order?</label><textarea id="f_items" name="items" required rows="2" placeholder="e.g. Jollof with chicken x3, fried rice x2">${esc(o.items||'')}</textarea></div>
  ${S.recipes.length?`<div class="field"><label>Which of your recipes? (optional)<span class="hint">Add them to take ingredients off stock when you start cooking, and to work out the price.</span></label><div id="lines">${(o.lines||[]).map(lineRow).join('')}</div><div class="actions" style="margin-top:6px"><button type="button" class="btn small" data-act="add-line">Add a recipe</button><button type="button" class="btn small soft" data-act="calc-total">Work out the price</button></div></div>`:''}
  <div class="two field"><div><label for="f_total">Total price</label><input type="number" id="f_total" name="total" step="any" min="0" required value="${esc(o.total??'')}"></div><div><label for="f_due">Needed by</label><input type="date" id="f_due" name="due" value="${esc(o.due||'')}"></div></div>
  <div class="field"><label for="f_paid">Paid so far<span class="hint">A deposit counts. It is added to Money in for you.</span></label><div style="display:flex;gap:8px"><input type="number" id="f_paid" name="paid" step="any" min="0" value="${esc(o.id||o.total?paidOf(o)||'':'')}"><button type="button" class="btn small" data-act="paid-full" style="white-space:nowrap">Paid in full</button></div></div>
  <div class="two field"><div><label for="f_status">Progress</label>${sel('status',['New','Preparing','Ready','Delivered'],o.status||'New')}</div><div><label for="f_delivery">Pickup or delivery</label>${sel('delivery',['Pickup','Delivery'],o.delivery||'Pickup')}</div></div>
  <div class="field"><label for="f_notes">Notes (optional)</label><input type="text" id="f_notes" name="notes" placeholder="Allergies, address, no pepper..." value="${esc(o.notes||'')}"></div>
  ${o.id?`<div class="actions"><button type="button" class="btn danger small" data-act="del" data-col="orders" data-id="${o.id}">Delete order</button></div>`:''}`,
  fd=>{
    const rn=fd.getAll('ln_recipe'),pn=fd.getAll('ln_portions');
    const lines=rn.map((r,i)=>({recipeId:r,portions:num(pn[i])||1})).filter(l=>l.recipeId);
    const total=num(fd.get('total')),paidAmount=num(fd.get('paid'));
    const rec={id:o.id||uid(),created:o.created||todayISO(),customer:fd.get('customer').trim(),source:fd.get('source'),handle:fd.get('handle').trim(),items:fd.get('items').trim(),lines,stockTaken:!!o.stockTaken,total,due:fd.get('due'),status:fd.get('status'),delivery:fd.get('delivery'),notes:fd.get('notes').trim(),paidAmount,paid:total>0&&paidAmount>=total,paidDate:paidAmount!==paidOf(o)?todayISO():(o.paidDate||''),example:false};
    let msg='Order saved';
    if(rec.status!=='New'&&!rec.stockTaken&&lines.length){if(takeStockForOrder(rec))msg='Order saved. Ingredients taken off stock.';rec.stockTaken=true}
    store.put('orders',rec);syncOrderMoney(rec);toast(msg);
  });
}
function customerView(key){
  const c=customers().find(x=>x.key===key);if(!c)return;
  const first=c.name.split(/\s+/)[0];
  sheet(c.name,`<div class="meta">${c.orders.length} ${c.orders.length===1?'order':'orders'} &middot; paid ${fmt(c.spent)}${c.source?' &middot; '+esc(c.source):''}${c.handle?' '+esc(c.handle):''}</div>
  ${c.owed>0?`<p style="margin:8px 0 0"><span class="pill warn">Owes ${fmt(c.owed)}</span></p>`:''}
  <ul class="plain">${c.orders.map(o=>`<li><span style="min-width:0">${esc(o.items)}<br><span class="meta">${fmtDate(o.created||o.due)} &middot; ${esc(o.status)}</span></span><span class="amt">${fmt(o.total)}</span></li>`).join('')}</ul>
  <div class="actions"><button type="button" class="btn primary" data-act="new-order-for" data-key="${esc(c.key)}">New order for ${esc(first)}</button></div>`,null);
}
function stockForm(s={}){
  sheet(s.id?'Edit stock item':'New stock item',`
  <div class="field"><label for="f_name">Name</label><input type="text" id="f_name" name="name" required value="${esc(s.name||'')}" placeholder="e.g. Flour, Cake boxes"></div>
  <div class="two field"><div><label for="f_category">Kind</label>${sel('category',['Ingredient','Packaging'],s.category||'Ingredient')}</div><div><label for="f_unit">Counted in</label><input type="text" id="f_unit" name="unit" required value="${esc(s.unit||'')}" placeholder="kg, packs, pieces"></div></div>
  <div class="two field"><div><label for="f_qty">How much you have now</label><input type="number" id="f_qty" name="qty" step="any" min="0" required value="${esc(s.qty??'')}"></div>
  <div><label for="f_low">Warn me at or below<span class="hint">Pick the amount where you would want to reorder.</span></label><input type="number" id="f_low" name="low" step="any" min="0" required value="${esc(s.low??'')}"></div></div>
  <div class="field"><label for="f_unitCost">Price for one unit (optional)<span class="hint">What you pay for one kg, pack or piece. It is used to work out what your recipes cost.</span></label><input type="number" id="f_unitCost" name="unitCost" step="any" min="0" value="${esc(s.unitCost??'')}"></div>
  ${s.id?`<div class="actions"><button type="button" class="btn danger small" data-act="del" data-col="stock" data-id="${s.id}">Delete item</button></div>`:''}`,
  fd=>{store.put('stock',{id:s.id,name:fd.get('name').trim(),category:fd.get('category'),unit:fd.get('unit').trim(),qty:num(fd.get('qty')),low:num(fd.get('low')),unitCost:num(fd.get('unitCost')),lastBought:s.lastBought||'',example:false});toast('Saved')});
}
function updateStockForm(id){
  const s=S.stock.find(x=>x.id===id);if(!s)return;
  sheet(s.name,`<p class="meta" style="margin-top:0">You have <b>${fmtN(s.qty)} ${esc(s.unit)}</b> now.</p>
  <div class="field"><label for="f_mode">What happened?</label><select name="mode" id="f_mode"><option value="add">I bought more</option><option value="use">I used some</option><option value="set">Set the exact amount (after counting)</option></select></div>
  <div class="field"><label for="f_amount">Amount (${esc(s.unit)})</label><input type="number" id="f_amount" name="amount" step="any" min="0" required></div>
  <div class="field"><label for="f_cost">What did it cost in total? (optional)<span class="hint">Added to Money out for you, and used to work out what your recipes cost.</span></label><input type="number" id="f_cost" name="cost" step="any" min="0"></div>`,
  fd=>{
    const a=num(fd.get('amount')),m=fd.get('mode');
    const qty=m==='add'?s.qty+a:m==='use'?Math.max(0,s.qty-a):a;
    const c=num(fd.get('cost'));
    store.put('stock',{...s,qty:+qty.toFixed(3),lastBought:m==='add'?todayISO():(s.lastBought||''),unitCost:(m==='add'&&c>0&&a>0)?+(c/a).toFixed(2):num(s.unitCost)});
    if(m==='add'&&c>0)store.put('money',{type:'out',cat:s.category==='Packaging'?'pack':'food',amount:c,date:todayISO(),note:'Bought '+fmtN(a)+' '+s.unit+' '+s.name});
    toast('Stock updated');
  });
}
function moneyForm(type,m={}){
  type=m.type||type;const cats=type==='in'?CATS_IN.map(c=>`<option value="${c[0]}" ${m.cat===c[0]?'selected':''}>${esc(c[1])}</option>`).join(''):
   `<optgroup label="Cost of making food">${CATS_OUT.filter(c=>c[2]==='cost').map(c=>`<option value="${c[0]}" ${m.cat===c[0]?'selected':''}>${esc(c[1])}</option>`).join('')}</optgroup><optgroup label="Running the business (overhead)">${CATS_OUT.filter(c=>c[2]==='overhead').map(c=>`<option value="${c[0]}" ${m.cat===c[0]?'selected':''}>${esc(c[1])}</option>`).join('')}</optgroup>`;
  sheet(m.id?'Edit entry':type==='in'?'Money in':'Money out',`
  <div class="field"><label for="f_amount">Amount</label><input type="number" id="f_amount" name="amount" step="any" min="0" required value="${esc(m.amount??'')}"></div>
  <div class="field"><label for="f_cat">${type==='in'?'Where did it come from?':'What was it for?'}</label><select name="cat" id="f_cat">${cats}</select></div>
  <div class="two field"><div><label for="f_date">Date</label><input type="date" id="f_date" name="date" required value="${esc(m.date||todayISO())}"></div><div><label for="f_note">Note (optional)</label><input type="text" id="f_note" name="note" value="${esc(m.note||'')}"></div></div>
  ${m.id?`<div class="actions"><button type="button" class="btn danger small" data-act="del" data-col="money" data-id="${m.id}">Delete entry</button></div>`:''}`,
  fd=>{store.put('money',{id:m.id,type,cat:fd.get('cat'),amount:num(fd.get('amount')),date:fd.get('date'),note:fd.get('note').trim(),orderId:m.orderId||null,example:false});toast('Saved')});
}
function shoppingList(){
  const L=lows(),text=L.map(s=>`- ${s.name} (have ${fmtN(s.qty)} ${s.unit}, warn at ${fmtN(s.low)})`).join('\n');
  sheet('Shopping list',L.length?`<ul class="plain">${L.map(s=>`<li><span>${esc(s.name)} <span class="meta">${esc(s.category)}</span></span><span class="meta">${fmtN(s.qty)} left</span></li>`).join('')}</ul><div class="actions"><button type="button" class="btn primary" data-act="copy" data-text="${esc(text)}">Copy list</button></div>`:'<p class="meta">Nothing is running low.</p>',null);
}
function settingsForm(){
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  sheet('Settings',`<div class="field"><label for="f_currency">Money symbol<span class="hint">Shown before every amount. It is set to &#8373; (Ghana cedi) now.</span></label><input type="text" id="f_currency" name="currency" maxlength="4" value="${esc(S.settings.currency||'')}"></div>
  <div class="field"><label for="f_keep">Profit I want to keep from each sale (%)<span class="hint">Used to suggest a price for each recipe. Half (50) is a good start.</span></label><input type="number" id="f_keep" name="keep" min="1" max="90" value="${esc(S.settings.keep||50)}"></div>
  <div class="field"><label>Low-stock alerts</label><p class="meta" style="margin:0 0 8px">${perm==='granted'?'Alerts are on. You get a notification when something drops to your warn level.':perm==='denied'?'Alerts are blocked. Open iPhone Settings, then Notifications, then BiteMATE.':'Alerts are off.'}</p>${perm==='granted'?'<button type="button" class="btn small" data-act="test-alert">Send a test alert</button>':perm==='default'?'<button type="button" class="btn small primary" data-act="enable-alerts">Turn on alerts</button>':''}</div>
  <div class="field"><label>Back up your data</label><p class="meta" style="margin:0 0 8px">Everything is stored on this phone. Save a backup now and then, and keep it in Files or iCloud.</p><div class="actions" style="margin:0"><button type="button" class="btn small" data-act="backup">Save a backup</button></div></div>
  <div class="field"><label for="restoreFile">Restore from a backup<span class="hint">This replaces what is on this phone now.</span></label><input type="file" id="restoreFile" accept="application/json,.json"></div>`,
  fd=>{S.settings.currency=fd.get('currency').trim();S.settings.keep=Math.min(90,Math.max(1,num(fd.get('keep'))||50));store.putSettings()});
}

/* ---------- Events ---------- */
const byId=(c,id)=>S[c].find(x=>x.id===id);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'close':closeSheet();break;
    case 'settings':settingsForm();break;
    case 'add-recipe':recipeForm();break;
    case 'open-recipe':recipeView(id);break;
    case 'edit-recipe':recipeForm(byId('recipes',id));break;
    case 'cook':cookForm(id);break;
    case 'add-ing':{const d=document.createElement('div');d.innerHTML=ingRow();$('#ings').appendChild(d.firstChild);break}
    case 'rm-row':t.closest('.ing,.line').remove();break;
    case 'add-line':{const d=document.createElement('div');d.innerHTML=lineRow();$('#lines').appendChild(d.firstChild);break}
    case 'add-order':orderForm();break;
    case 'edit-order':orderForm(byId('orders',id));break;
    case 'order-filter':U.orderF=t.dataset.v;render();break;
    case 'cust-sort':U.custSort=t.dataset.v;render();break;
    case 'cust-period':U.custPeriod=t.dataset.v;render();break;
    case 'view-customer':customerView(t.dataset.key);break;
    case 'new-order-for':{const c=customers().find(x=>x.key===t.dataset.key);closeSheet();orderForm({customer:c?c.name:'',source:c?c.source:'',handle:c?c.handle:''});break}
    case 'paid-full':{const f=$('#f_total'),p=$('#f_paid');if(f&&p&&f.value)p.value=f.value;break}
    case 'calc-total':{let tot=0,any=false;document.querySelectorAll('#lines .line').forEach(r=>{const rc=S.recipes.find(x=>x.id===r.querySelector('select').value),n=num(r.querySelector('input').value)||1;if(rc&&num(rc.price)>0){tot+=num(rc.price)*n;any=true}});if(any){$('#f_total').value=+tot.toFixed(2);toast('Price worked out from your recipes')}else toast('Add a recipe that has a price first');break}
    case 'next-status':{const o=byId('orders',id),n={New:'Preparing',Preparing:'Ready',Ready:'Delivered'}[o.status];const upd={...o,status:n};let msg='';if(!o.stockTaken&&(o.lines||[]).length){if(takeStockForOrder(o))msg='Ingredients taken off stock';upd.stockTaken=true}store.put('orders',upd);if(msg)toast(msg);break}
    case 'mark-paid':{const o0=byId('orders',id),o={...o0,paid:true,paidAmount:num(o0.total),paidDate:todayISO()};store.put('orders',o);syncOrderMoney(o);toast('Added to Money in');break}
    case 'add-stock':stockForm();break;
    case 'edit-stock':stockForm(byId('stock',id));break;
    case 'update-stock':updateStockForm(id);break;
    case 'stock-filter':U.stockF=t.dataset.v;render();break;
    case 'shopping':shoppingList();break;
    case 'add-money':moneyForm(t.dataset.type);break;
    case 'edit-money':moneyForm('in',byId('money',id));break;
    case 'month':{const [y,m]=U.month.split('-').map(Number),d=new Date(y,m-1+Number(t.dataset.v),1);U.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'copy':{const txt=t.dataset.text;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;t.after(ta);ta.select();toast('Select and copy the text')});break}
    case 'enable-alerts':Notification.requestPermission().then(p=>{toast(p==='granted'?'Alerts are on':'Alerts were not turned on');if(p==='granted')notify('Alerts are on','You will be told when stock runs low.');render();if($('#sheet'))settingsForm()}).catch(()=>{});break;
    case 'test-alert':notify('BiteMATE','This is a test alert.').then(ok=>toast(ok?'Test alert sent':'Could not send an alert'));break;
    case 'backup':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),name='bitemate-backup-'+todayISO()+'.json';let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(()=>{});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}break}
    case 'clear-examples':COLS.forEach(c=>S[c].filter(x=>x.example).forEach(x=>store.del(c,x.id)));toast('Samples removed');break;
    case 'del':{
      if(!t.classList.contains('armed')){t.classList.add('armed');t.dataset.old=t.textContent;t.textContent='Tap again to confirm';setTimeout(()=>{t.classList.remove('armed');if(t.dataset.old)t.textContent=t.dataset.old},3500);break}
      const col=t.dataset.col;store.del(col,id);if(col==='orders')store.del('money','order-'+id);closeSheet();toast('Deleted');break}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='f_customer'){const c=customers().find(x=>x.key===ckey(e.target.value));if(c){const h=$('#f_handle'),so=$('#f_source');if(h&&!h.value)h.value=c.handle;if(so&&c.source)so.value=c.source}}
  if(e.target.id!=='restoreFile'||!e.target.files[0])return;
  e.target.files[0].text().then(t=>{const d=JSON.parse(t);if(!COLS.every(c=>Array.isArray(d[c])))throw 0;COLS.forEach(c=>S[c]=d[c]);S.settings={...S.settings,...(d.settings||{})};store.saveLocal();closeSheet();checkAlerts(true);render();toast('Backup restored')}).catch(()=>toast('That file is not a BiteMATE backup'));
});
document.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}});
function route(){const h=location.hash.slice(1);U.tab=['recipes','orders','stock','money'].includes(h)?h:'recipes';render();window.scrollTo(0,0)}
addEventListener('hashchange',route);
route();store.init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkAlerts(true)}});
</script></body></html>
